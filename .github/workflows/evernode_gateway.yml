name: Publish Evernode gateway compatibility image
on:
  push:
    branches: [poc/gateway-compat]
    paths:
      - deploy/evernode-poc/**
      - .github/workflows/evernode_gateway.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evernode-gateway-compat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the exact compatibility commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Type check, test, and bundle the standalone project
        run: docker build --platform=linux/amd64 -f deploy/evernode-poc/deploy/validation.Dockerfile -t warthog-poc-validation:ci deploy/evernode-poc
      - name: Build the compatibility gateway
        run: docker build --platform=linux/amd64 -f deploy/evernode-poc/gateway/Dockerfile -t warthog-poc-gateway:compat deploy/evernode-poc
      - name: Build actual-process fixtures
        run: docker build --platform=linux/amd64 -f deploy/evernode-poc/tests/Dockerfile -t warthog-poc-gateway-tests:compat deploy/evernode-poc
      - name: Test routing, failures, closed admission, and TLS in isolation
        run: docker run --rm --network=none --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=256m --cpus=1 warthog-poc-gateway-tests:compat
      - name: Test root bootstrap dropping to the unprivileged TLS runtime
        run: docker run --rm --user=0:0 --network=none --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --security-opt=no-new-privileges --pids-limit=128 --memory=256m --cpus=1 warthog-poc-gateway-tests:compat node --test --test-concurrency=1 tests/platform-tls-container.test.ts
      - name: Build authenticated setup and process-control fixtures
        run: docker build --platform=linux/amd64 -f deploy/evernode-poc/tests/fault.Dockerfile -t warthog-poc-fault-tests:trial deploy/evernode-poc
      - name: Test private setup and bounded process controls without host access
        run: docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=256m --cpus=1 --tmpfs=/run/poc:rw,noexec,nosuid,size=16m,mode=0700,uid=1000,gid=1000 --tmpfs=/tmp:rw,noexec,nosuid,size=8m,mode=1777 warthog-poc-fault-tests:trial
      - name: Build the worker and gateway pilot runtimes
        run: |
          docker build --platform=linux/amd64 -f deploy/evernode-poc/runtime/Dockerfile -t warthog-poc-runtime:trial deploy/evernode-poc
          docker build --platform=linux/amd64 --build-arg PILOT_RUNTIME=gateway -f deploy/evernode-poc/runtime/Dockerfile -t warthog-poc-gateway-runtime:trial deploy/evernode-poc
      - name: Build and test complete runtime startup, setup, storage and process groups
        run: |
          docker build --platform=linux/amd64 -f deploy/evernode-poc/tests/runtime.Dockerfile -t warthog-poc-runtime-tests:trial deploy/evernode-poc
          docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --security-opt=no-new-privileges --pids-limit=128 --memory=512m --cpus=1 --tmpfs=/run/poc:rw,noexec,nosuid,size=16m,mode=0700 --tmpfs=/warthog/.warthog:rw,noexec,nosuid,size=32m,mode=0700 --tmpfs=/pilotdata:rw,noexec,nosuid,size=16m,mode=0700 --tmpfs=/tmp:rw,noexec,nosuid,size=8m,mode=1777 warthog-poc-runtime-tests:trial
      - name: Test the offsite experiment service with an independent fresh volume
        run: docker run --rm --network=none --read-only --cap-drop=ALL --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --security-opt=no-new-privileges --pids-limit=128 --memory=512m --cpus=1 --tmpfs=/run/poc:rw,noexec,nosuid,size=16m,mode=0700 --tmpfs=/warthog/.warthog:rw,noexec,nosuid,size=32m,mode=0700 --tmpfs=/pilotdata:rw,noexec,nosuid,size=16m,mode=0700 --tmpfs=/tmp:rw,noexec,nosuid,size=8m,mode=1777 --entrypoint=node warthog-poc-runtime-tests:trial --test tests/finite-gateway-process.test.ts
      - name: Build the controller wrapper and verify the actual Node 20 syntax
        run: |
          docker build --platform=linux/amd64 -f deploy/evernode-poc/runtime/controller.Dockerfile -t warthog-poc-controller:trial deploy/evernode-poc
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=128m --cpus=1 --entrypoint=node warthog-poc-controller:trial --check /app/supervisor.mjs
      - name: Test the host's actual native initialization and run command shapes
        run: |
          docker build --platform=linux/amd64 -f deploy/evernode-poc/tests/controller.Dockerfile -t warthog-poc-controller-cli-tests:trial deploy/evernode-poc
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=1 --tmpfs=/tmp:rw,nosuid,size=32m,mode=1777 warthog-poc-controller-cli-tests:trial
      - name: Test the compiled contract against the native Node 20 SDK protocol
        run: |
          docker build --platform=linux/amd64 -f deploy/evernode-poc/tests/native-contract.Dockerfile -t warthog-poc-native-contract-tests:trial deploy/evernode-poc
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=1 --tmpfs=/tmp:rw,noexec,nosuid,size=32m,mode=1777 warthog-poc-native-contract-tests:trial
      - name: Log in to the existing public image package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested gateway under a unique tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/warthog-node
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          tag="gw-${GITHUB_SHA:0:12}"
          docker tag warthog-poc-gateway:compat "$image:$tag"
          docker push "$image:$tag"
          docker buildx imagetools inspect "$image:$tag"
          for pair in 'warthog-poc-runtime:trial pw' 'warthog-poc-gateway-runtime:trial pg' 'warthog-poc-controller:trial pc'; do
            read -r source prefix <<< "$pair"
            runtime_tag="$prefix-${GITHUB_SHA:0:12}"
            docker tag "$source" "$image:$runtime_tag"
            docker push "$image:$runtime_tag"
            docker buildx imagetools inspect "$image:$runtime_tag"
          done
          {
            echo '### Evernode gateway compatibility release'
            printf '\n`%s:%s`\n' "$image" "$tag"
            echo
            echo 'Default admission is closed. This image does not initiate paid leases.'
          } >> "$GITHUB_STEP_SUMMARY"
