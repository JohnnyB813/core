name: Publish Evernode persistence trial

on:
  push:
    branches: [fix/evernode-persistence]
    paths:
      - deploy/evernode/**
      - .github/workflows/evernode_trial.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evernode-persistence-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trial-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the trial commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the exact image to be tested and published
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: deploy/evernode
          platforms: linux/amd64
          load: true
          provenance: false
          tags: warthog-evernode:ci
      - name: Pull the pinned SQLite test helper
        run: docker pull python:3.14-alpine3.23@sha256:f6a7dec95e6205059dccfcb07faca3ca38729ea35df01231caf1d127bacedec8
      - name: Verify public API and SQLite persistence across restart and recreation
        run: python3 deploy/evernode/test_image.py --image warthog-evernode:ci --output evernode-persistence-result.json
      - name: Log in to the existing public package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only the unique trial tag
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/warthog-node
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          tag="evr-${GITHUB_SHA:0:12}"
          docker tag warthog-evernode:ci "$image:$tag"
          docker push "$image:$tag"
          printf 'Published tested image: %s:%s\n' "$image" "$tag"
          docker buildx imagetools inspect "$image:$tag"
          {
            echo '### Evernode persistence trial image'
            printf '\n`%s:%s`\n' "$image" "$tag"
            echo
            echo 'Production master, dev, and latest tags were not changed.'
            echo
            echo 'First start is isolated. Perform one controlled host restart and verify the same volume ID and nonempty databases.'
          } >> "$GITHUB_STEP_SUMMARY"
