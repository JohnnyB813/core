name: Release
on:
  workflow_dispatch:
      
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

        - name : Meson Test
          run : DOCKER_BUILDKIT=1 docker build . --file dockerfiles/run_tests --build-arg WARTHOG_COMMIT=${{ github.sha }} --progress plain
    
        - name: Docker Build
          run: DOCKER_BUILDKIT=1 docker build . -f dockerfiles/build_linux --build-arg WARTHOG_COMMIT=${{ github.sha }} --output build
    
        - name: Docker Build Windows
          run: DOCKER_BUILDKIT=1 docker build . -f dockerfiles/build_windows --build-arg WARTHOG_COMMIT=${{ github.sha }} --output ./build/windows
    
        - name : Docker Build MacOS
          continue-on-error: true
          run : DOCKER_BUILDKIT=1 docker build . -f dockerfiles/build_macos --build-arg WARTHOG_COMMIT=${{ github.sha }} --output ./build/aarch64-macos

        - name: Get version
          id: get_version
          run: |
           echo "VERSION=$(grep 'version :' meson.build | cut -d "'" -f 2)" >> $GITHUB_ENV 

        - name: Release
          uses: softprops/action-gh-release@v2.2.1
          with:
            tag_name: ${{ env.VERSION }}
            generate_release_notes: true
            make_latest: true
            files: |
              ./build/aarch64-macos/wart-wallet-aarch64
              ./build/aarch64-macos/wart-node-aarch64
              ./build/windows/wart-wallet-windows.exe
              ./build/windows/wart-node-windows.exe
              ./build/wart-node-linux
              ./build/wart-wallet-linux
